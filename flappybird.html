<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #70c5ce;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas {
      display: block;
    }

    .ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      color: #2c3e50;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      pointer-events: auto;
    }

    .score-panel {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: auto;
    }

    .score-panel .current {
      font-size: 36px;
      color: #e74c3c;
      font-weight: bold;
    }

    .score-panel .high {
      font-size: 20px;
      color: #7f8c8d;
      margin-top: 5px;
    }

    .btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 30px;
      font-size: 24px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #c0392b;
    }

    .instructions {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #7f8c8d;
    }

    .pipe {
      position: absolute;
      right: 0;
      width: 80px;
      height: 0;
      background: #27ae60;
      transition: top 0.02s linear, bottom 0.02s linear;
    }

    .pipe.top {
      border-top-right-radius: 20px 20px;
    }

    .pipe.bottom {
      border-bottom-left-radius: 20px 20px;
      top: auto;
      bottom: 0;
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: #2c3e50;
      background: linear-gradient(90deg, #2c3e50 0%, #bdc3c7 100%);
    </style>
</head>
<body>
  <canvas id="gameCanvas" width="360" height="640"></canvas>

  <div class="ui">
    <div class="title">Flappy Bird</div>
    <div class="score-panel">
      <div class="current" id="score">0</div>
      <div class="high" id="highScore">High: 0</div>
    </div>
    <button class="btn" id="startBtn">Start</button>
    <div class="instructions">Klicken oder Leertaste zum Fliegen</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    // Game state
    let gameActive = false;
    let frame = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('flappyHighScore') || '0');

    // Bird
    const bird = {
      x: 60,
      y: canvas.height / 2,
      width: 34,
      height: 24,
      gravity: 0.6,
      jump: -10,
      dy: 0,
      rotation: 0
    };

    // Pipes
    const pipes = [];
    const pipeWidth = 80;
    const pipeGap = 180;
    const pipeSpeed = 3;

    // Start button handler
    startBtn.addEventListener('click', startGame);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (gameActive) {
          bird.dy = bird.jump;
        } else {
          startGame();
        }
      }
    });

    function startGame() {
      gameActive = true;
      score = 0;
      scoreEl.textContent = score;
      pipes.length = 0;
      bird.y = canvas.height / 2;
      bird.dy = 0;
      bird.rotation = 0;
      startBtn.style.display = 'none';
      update();
    }

    function spawnPipe() {
      const minHeight = 80;
      const maxHeight = canvas.height - 80 - pipeGap - minHeight;
      const height = Math.floor(Math.random() * maxHeight) + minHeight;
      
      const topPipe = {
        x: canvas.width,
        top: height,
        passed: false
      };
      
      const bottomPipe = {
        x: canvas.width,
        top: height + pipeGap,
        passed: false
      };
      
      pipes.push(topPipe, bottomPipe);
    }

    function update() {
      if (!gameActive) return;

      frame++;
      
      // Bird physics
      bird.dy += bird.gravity;
      bird.y += bird.dy;
      bird.rotation += 0.3;
      if (bird.rotation > 0.5) bird.rotation = 0.5; // tilt max

      // Pipes movement
      if (frame % 90 === 0) {
        spawnPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const pipe = pipes[i];
        pipe.x -= pipeSpeed;

        // Collision detection
        if (
          bird.x < pipe.x + pipeWidth &&
          bird.x + bird.width > pipe.x &&
          bird.y < pipe.top + pipeWidth &&
          bird.y + bird.height > pipe.top
        ) {
          gameOver();
        }

        // Scoring
        if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
          pipe.passed = true;
          score++;
          scoreEl.textContent = score;
        }

        // Remove off-screen pipes
        if (pipe.x + pipeWidth < 0) {
          pipes.splice(i, 1);
        }
      }

      // Ground collision
      if (bird.y + bird.height >= canvas.height - 120 || bird.y <= 0) {
        gameOver();
      }

      // Draw everything
      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw pipes
      for (const pipe of pipes) {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.top + pipeGap, pipeWidth, canvas.height);
      }

      // Draw bird
      ctx.save();
      ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
      ctx.rotate(bird.rotation);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-bird.width / 2, -bird.height / 2, bird.width, bird.height);
      ctx.restore();

      // Draw ground
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
    }

    function gameOver() {
      gameActive = false;
      highScoreEl.textContent = `High: ${highScore}`;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('flappyHighScore', highScore.toString());
      }
      
      startBtn.style.display = 'block';
      startBtn.textContent = 'Neustart';
    }

    // Initial draw
    draw();
  </script>
</body>
</html>
