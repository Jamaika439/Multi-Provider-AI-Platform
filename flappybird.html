<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<title>Flappy Bird: HARDCORE COMBAT</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 20%, #171f2d, #05070a 80%);
    display:flex;align-items:center;justify-content:center;
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;
    color:#fff;
  }
  #wrap{position:relative;line-height:0;}

  canvas{
    display:block;border-radius:18px;overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.85), 0 0 0 3px rgba(239,68,68,.35), 0 0 30px rgba(239,68,68,.2);
    touch-action:none;cursor:pointer;
  }

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;line-height:1.2;padding:12px 16px;}

  .hud-top{
    display:flex;justify-content:space-between;align-items:flex-start;
  }

  #scoreBox{
    text-align:center;
  }
  #score{
    font-size:42px;font-weight:900;color:#fff;
    text-shadow:0 3px 0 #000, 0 0 15px rgba(255,100,50,.8);
    letter-spacing:2px;font-family:monospace;
  }
  #streak{
    font-size:12px;font-weight:bold;color:#f59e0b;
    text-transform:uppercase;letter-spacing:1px;min-height:16px;
  }

  .stats-left{
    display:flex;flex-direction:column;gap:6px;
  }
  .hp-bar{
    display:flex;gap:4px;font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .weapon-badge{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);
    padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold;
    letter-spacing:0.5px;color:#38bdf8;
  }

  #muteBtn{
    width:36px;height:36px;
    border:none;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;
    font-size:17px;cursor:pointer;pointer-events:auto;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, transform .1s;
    border:1px solid rgba(255,255,255,.15);
  }
  #muteBtn:hover{background:rgba(239,68,68,.5);}
  #muteBtn:active{transform:scale(.9);}

  /* ---------- Overlay ---------- */
  #overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(3,6,12,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    pointer-events:auto;
  }
  #overlay.hidden{display:none;}

  .panel{
    text-align:center;color:#fff;padding:28px 24px;max-width:92%;
    background:rgba(18,24,38,.85);border:1px solid rgba(239,68,68,.4);
    border-radius:24px;box-shadow:0 15px 40px rgba(0,0,0,.7), 0 0 30px rgba(239,68,68,.15);
    animation:rise .25s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}

  .badge-hardcore{
    display:inline-block;padding:4px 12px;border-radius:20px;
    background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff;
    font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;
    margin-bottom:8px;box-shadow:0 0 12px rgba(239,68,68,.6);
  }
  .title{
    font-size:32px;font-weight:900;letter-spacing:2px;
    text-shadow:0 3px 0 #000;
    background:linear-gradient(#fff 20%,#ff9494);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{margin-top:10px;font-size:13.5px;opacity:.9;line-height:1.5;color:#cbd5e1;}

  .feature-list{
    margin:14px auto;text-align:left;font-size:12px;color:#94a3b8;
    background:rgba(0,0,0,.35);padding:10px 14px;border-radius:12px;
    border:1px solid rgba(255,255,255,.08);display:inline-block;
  }
  .feature-list li{list-style:none;margin:4px 0;display:flex;align-items:center;gap:6px;}

  .result{font-size:22px;margin:10px 0 2px;}
  .result b{font-size:40px;color:#f87171;margin-left:8px;font-family:monospace;}
  .record{margin-top:4px;font-size:15px;color:#fbbf24;font-weight:bold;}

  .btn{
    margin-top:16px;padding:12px 36px;font-size:18px;font-weight:bold;letter-spacing:1px;
    color:#fff;background:linear-gradient(#ef4444,#b91c1c);border:none;border-radius:40px;
    cursor:pointer;box-shadow:0 5px 0 #7f1d1d, 0 10px 20px rgba(239,68,68,.4);
    transition:transform .08s, box-shadow .08s, filter .15s;
    font-family:inherit;text-transform:uppercase;
  }
  .btn:hover{filter:brightness(1.15);box-shadow:0 5px 0 #7f1d1d, 0 12px 25px rgba(239,68,68,.6);}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #7f1d1d, 0 5px 10px rgba(0,0,0,.5);}

  .hint{margin-top:14px;font-size:11.5px;opacity:.7;color:#94a3b8;}
  kbd{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
    border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11px;color:#fff;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-top">
      <div class="stats-left">
        <div class="hp-bar" id="hpBar">❤️❤️❤️</div>
        <div class="weapon-badge" id="weaponBadge">⚡ LVL 1 BLASTER</div>
      </div>

      <div id="scoreBox">
        <div id="score">0</div>
        <div id="streak"></div>
      </div>

      <button id="muteBtn" title="Ton an/aus" aria-label="Ton an/aus">🔊</button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel" id="panel">
      <div id="panelTop"></div>
      <div id="panelBody"></div>
      <button class="btn" id="actionBtn">STARTEN</button>
      <div class="hint" id="panelHint"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =======================================================================
     Konstanten & Welt
     ======================================================================= */
  const W = 380, H = 640;
  const GROUND_H = 80;
  const GROUND_Y = H - GROUND_H;

  const BIRD_X = 80;
  const BIRD_R = 14;

  const GRAVITY = 1650;
  const FLAP_V   = -490;
  const MAX_FALL = 850;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const hpBarEl = document.getElementById('hpBar');
  const weaponBadgeEl = document.getElementById('weaponBadge');
  const overlay = document.getElementById('overlay');
  const panelTop = document.getElementById('panelTop');
  const panelBody = document.getElementById('panelBody');
  const actionBtn = document.getElementById('actionBtn');
  const panelHint = document.getElementById('panelHint');
  const muteBtn = document.getElementById('muteBtn');

  let DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const scale = Math.min((window.innerWidth - 16) / W, (window.innerHeight - 16) / H);
    canvas.style.width  = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* =======================================================================
     Synthesized WebAudio SFX
     ======================================================================= */
  let actx = null;
  let muted = localStorage.getItem('fbHardcoreMuted') === '1';

  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(f1, f2, dur, type = 'sine', vol = 0.2) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function noise(dur = 0.2, vol = 0.25, freq = 800) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const filt = a.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(filt); filt.connect(g); g.connect(a.destination);
    src.start();
  }

  const sfx = {
    flap:      () => tone(340, 520, 0.09, 'sine', 0.15),
    shoot:     () => tone(980, 220, 0.08, 'sawtooth', 0.1),
    spread:    () => { tone(1200, 300, 0.09, 'sawtooth', 0.1); tone(800, 200, 0.09, 'triangle', 0.1); },
    plasma:    () => tone(450, 80, 0.16, 'square', 0.14),
    hitEnemy:  () => tone(180, 80, 0.05, 'triangle', 0.15),
    explode:   () => { noise(0.28, 0.35, 600); tone(180, 40, 0.25, 'sawtooth', 0.2); },
    bossBoom:  () => { noise(0.6, 0.6, 400); tone(240, 30, 0.5, 'sawtooth', 0.4); },
    powerup:   () => { tone(420, 840, 0.1, 'sine', 0.2); setTimeout(() => tone(840, 1400, 0.15, 'sine', 0.25), 80); },
    shieldHit: () => tone(600, 180, 0.18, 'sine', 0.3),
    nuke:      () => { noise(0.8, 0.7, 300); tone(300, 40, 0.8, 'sawtooth', 0.5); },
    playerHit: () => { noise(0.25, 0.4, 450); tone(220, 50, 0.3, 'sawtooth', 0.3); }
  };

  function syncMute() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    localStorage.setItem('fbHardcoreMuted', muted ? '1' : '0');
  }
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    syncMute();
  });
  syncMute();

  /* =======================================================================
     Spielzustand & Entities
     ======================================================================= */
  const STATE = { READY: 'ready', PLAYING: 'playing', DYING: 'dying', OVER: 'over', PAUSED: 'paused' };
  let state = STATE.READY;

  let score = 0;
  let kills = 0;
  let combo = 0;
  let comboTimer = 0;
  let highScore = parseInt(localStorage.getItem('fbHardcoreHighScore') || '0', 10) || 0;
  let newRecord = false;

  let bgScroll = 0;
  let shake = 0;
  let flash = 0;
  let overDelay = 0;

  // Waffensystem
  const WEAPON_NAMES = ['LVL 1 BLASTER', 'LVL 2 TWIN LASER', 'LVL 3 SPREAD GUN', 'LVL 4 PLASMA CANNON'];
  let weaponLevel = 1;
  let fireTimer = 0;
  let rapidFireTimer = 0;

  // Spieler
  const bird = {
    x: BIRD_X, y: 260, vy: 0, rot: 0,
    wingPhase: 0, wingT: 0,
    hp: 3, maxHp: 3,
    shield: 0,
    invulnerable: 0,
    alive: true
  };

  // Pools
  const bullets = [];
  const enemies = [];
  const enemyBullets = [];
  const powerups = [];
  const particles = [];
  const floatTexts = [];
  const stars = [];

  // Spawner Timer
  let spawnEnemyTimer = 0;
  let spawnInterval = 1.35;
  let difficultyTime = 0;

  // Sterne / Sternenhimmel
  for (let i = 0; i < 45; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (H - 50),
      s: 0.8 + Math.random() * 1.8,
      spd: 15 + Math.random() * 45,
      alpha: 0.3 + Math.random() * 0.7
    });
  }

  /* =======================================================================
     Waffen- und Schadenslogik
     ======================================================================= */
  function getFireRate() {
    const base = weaponLevel === 1 ? 0.22 : weaponLevel === 2 ? 0.18 : weaponLevel === 3 ? 0.16 : 0.2;
    return rapidFireTimer > 0 ? base * 0.55 : base;
  }

  function fireWeapon() {
    if (fireTimer > 0 || !bird.alive) return;
    fireTimer = getFireRate();

    if (weaponLevel === 1) {
      bullets.push({ x: bird.x + 16, y: bird.y, vx: 520, vy: 0, r: 4, dmg: 1, color: '#facc15', type: 'laser' });
      sfx.shoot();
    } else if (weaponLevel === 2) {
      bullets.push({ x: bird.x + 16, y: bird.y - 6, vx: 580, vy: 0, r: 4.5, dmg: 1.2, color: '#38bdf8', type: 'laser' });
      bullets.push({ x: bird.x + 16, y: bird.y + 6, vx: 580, vy: 0, r: 4.5, dmg: 1.2, color: '#38bdf8', type: 'laser' });
      sfx.shoot();
    } else if (weaponLevel === 3) {
      bullets.push({ x: bird.x + 16, y: bird.y, vx: 560, vy: 0, r: 4, dmg: 1.1, color: '#c084fc', type: 'laser' });
      bullets.push({ x: bird.x + 16, y: bird.y - 4, vx: 540, vy: -110, r: 4, dmg: 1.1, color: '#c084fc', type: 'laser' });
      bullets.push({ x: bird.x + 16, y: bird.y + 4, vx: 540, vy: 110, r: 4, dmg: 1.1, color: '#c084fc', type: 'laser' });
      sfx.spread();
    } else {
      // Level 4 Plasma
      bullets.push({ x: bird.x + 18, y: bird.y, vx: 480, vy: 0, r: 8, dmg: 2.8, color: '#f43f5e', type: 'plasma' });
      bullets.push({ x: bird.x + 14, y: bird.y - 7, vx: 520, vy: -70, r: 4, dmg: 1.2, color: '#fb923c', type: 'laser' });
      bullets.push({ x: bird.x + 14, y: bird.y + 7, vx: 520, vy: 70, r: 4, dmg: 1.2, color: '#fb923c', type: 'laser' });
      sfx.plasma();
    }
  }

  function triggerNuke() {
    flash = 0.7;
    shake = 16;
    sfx.nuke();
    addFloatText(W / 2, H / 2, '💥 EMP NUKE!', '#f43f5e', 24);

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      spawnExplosion(e.x, e.y, e.r * 1.8, '#f87171');
      score += 150;
      kills++;
    }
    enemies.length = 0;
    enemyBullets.length = 0;
    updateHUD();
  }

  function spawnPowerup(x, y) {
    const roll = Math.random();
    let type = 'upgrade';
    let icon = '⚡';
    let color = '#38bdf8';

    if (roll < 0.35) {
      type = 'upgrade'; icon = '⚡'; color = '#38bdf8';
    } else if (roll < 0.6) {
      type = 'shield'; icon = '🛡️'; color = '#a855f7';
    } else if (roll < 0.8) {
      type = 'heart'; icon = '❤️'; color = '#ef4444';
    } else if (roll < 0.92) {
      type = 'rapid'; icon = '🔥'; color = '#f97316';
    } else {
      type = 'nuke'; icon = '💣'; color = '#e11d48';
    }

    powerups.push({ x, y, vx: -50, vy: (Math.random() - 0.5) * 30, type, icon, color, r: 14, t: 0 });
  }

  /* =======================================================================
     Gegner-Typen
     ======================================================================= */
  function spawnEnemy() {
    const roll = Math.random();
    const y = 50 + Math.random() * (GROUND_Y - 110);

    if (roll < 0.45) {
      // Drone (schnell, gerader Flug)
      enemies.push({
        type: 'drone', x: W + 20, y, vx: -140 - Math.random() * 50, vy: 0,
        hp: 2, maxHp: 2, r: 13, color: '#ef4444', scoreVal: 100,
        shootTimer: 1.5 + Math.random() * 1.5, t: 0
      });
    } else if (roll < 0.75) {
      // Kamikaze Bat (Sinus-Welle, taucht ab)
      enemies.push({
        type: 'kamikaze', x: W + 20, y, vx: -170, vy: 0,
        baseY: y, hp: 1, maxHp: 1, r: 11, color: '#f97316', scoreVal: 120,
        t: Math.random() * 6
      });
    } else if (roll < 0.93) {
      // Gunship (schießt Plasma)
      enemies.push({
        type: 'gunship', x: W + 25, y, vx: -85, vy: 0,
        hp: 5, maxHp: 5, r: 18, color: '#a855f7', scoreVal: 250,
        shootTimer: 1.0, t: 0
      });
    } else {
      // Heavy Mecha
      enemies.push({
        type: 'heavy', x: W + 30, y: Math.min(y, GROUND_Y - 90), vx: -60, vy: 0,
        hp: 9, maxHp: 9, r: 22, color: '#dc2626', scoreVal: 400,
        shootTimer: 0.9, t: 0
      });
    }
  }

  /* =======================================================================
     HUD & Text-Effekte
     ======================================================================= */
  function updateHUD() {
    scoreEl.textContent = score;

    // HP Bar
    let hpStr = '';
    for (let i = 0; i < bird.maxHp; i++) {
      hpStr += i < bird.hp ? '❤️' : '🖤';
    }
    if (bird.shield > 0) hpStr += ' 🛡️';
    hpBarEl.textContent = hpStr;

    // Weapon Badge
    let wName = WEAPON_NAMES[weaponLevel - 1];
    if (rapidFireTimer > 0) wName += ' [RAPID]';
    weaponBadgeEl.textContent = wName;
    weaponBadgeEl.style.color = weaponLevel === 4 ? '#f43f5e' : weaponLevel === 3 ? '#c084fc' : weaponLevel === 2 ? '#38bdf8' : '#facc15';

    // Streak
    if (combo >= 3) {
      streakEl.textContent = `★ ${combo}x STREAK!`;
      streakEl.style.color = combo >= 8 ? '#f43f5e' : combo >= 5 ? '#f59e0b' : '#38bdf8';
    } else {
      streakEl.textContent = '';
    }
  }

  function addFloatText(x, y, text, color = '#fff', size = 14) {
    floatTexts.push({ x, y, text, color, size, life: 1 });
  }

  function spawnExplosion(x, y, count = 16, color = '#f97316') {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 160;
      particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        r: 1.5 + Math.random() * 3,
        color: Math.random() > 0.4 ? color : '#facc15',
        life: 0.6 + Math.random() * 0.4
      });
    }
  }

  /* =======================================================================
     Spielsteuerung / Game Flow
     ======================================================================= */
  function resetWorld() {
    score = 0;
    kills = 0;
    combo = 0;
    comboTimer = 0;
    newRecord = false;
    bgScroll = 0; shake = 0; flash = 0; overDelay = 0;
    weaponLevel = 1;
    fireTimer = 0;
    rapidFireTimer = 0;
    difficultyTime = 0;
    spawnInterval = 1.35;

    bird.x = BIRD_X; bird.y = 260; bird.vy = 0; bird.rot = 0;
    bird.wingPhase = 0; bird.wingT = 0;
    bird.hp = 3;
    bird.shield = 0;
    bird.invulnerable = 0;
    bird.alive = true;

    bullets.length = 0;
    enemies.length = 0;
    enemyBullets.length = 0;
    powerups.length = 0;
    particles.length = 0;
    floatTexts.length = 0;

    updateHUD();
  }

  function startGame() {
    resetWorld();
    state = STATE.PLAYING;
    hidePanel();
    flap();
  }

  function showPanel(topHtml, bodyHtml, btnText, hintHtml) {
    panelTop.innerHTML = topHtml;
    panelBody.innerHTML = bodyHtml;
    actionBtn.textContent = btnText;
    panelHint.innerHTML = hintHtml;
    overlay.classList.remove('hidden');
  }
  function hidePanel() { overlay.classList.add('hidden'); }

  function panelReady() {
    showPanel(
      '<div class="badge-hardcore">HARDCORE MODE</div><div class="title">CYBER BIRD</div>',
      '<div class="subtitle">Keine Röhren mehr. Reiner Kampf ums Überleben!<br>Gegner abballern, Power-Ups sammeln, Rekorde brechen.</div>' +
      '<div class="feature-list">' +
      '<li>🔫 <b>Waffensystem:</b> Upgrades bis Stufe 4</li>' +
      '<li>🛡️ <b>Schilde & Herzen:</b> Halte dich am Leben</li>' +
      '<li>💣 <b>EMP Nukes:</b> Vernichte alles auf dem Schirm</li>' +
      '</div>',
      'KAMPF STARTEN',
      'Fliegen & Feuern: <kbd>Space</kbd> / <kbd>↑</kbd> / Klick &nbsp;·&nbsp; Pause: <kbd>P</kbd>'
    );
  }

  function panelOver() {
    const medal = score >= 5000 ? '🏆 LEGENDÄR' : score >= 2500 ? '🥇 MEISTER' : score >= 1000 ? '🥈 VETERAN' : '🥉 KÄMPFER';
    showPanel(
      '<div class="badge-hardcore">' + medal + '</div><div class="title" style="font-size:30px">MISSION GESCHEITERT</div>',
      '<div class="result">Punkte<b>' + score + '</b></div>' +
      '<div class="result" style="font-size:15px;opacity:.9">Gegner eliminiert: <b style="font-size:22px;color:#38bdf8">' + kills + '</b></div>' +
      '<div class="result" style="font-size:15px;opacity:.85">Highscore<b style="font-size:22px">' + highScore + '</b></div>' +
      (newRecord ? '<div class="record">★ NEUER REKORD! ★</div>' : ''),
      'NOCHMAL KÄMPFEN',
      'Drücke <kbd>Space</kbd> oder klicke zum Neustarten'
    );
  }

  function flap() {
    if (state === STATE.READY || state === STATE.OVER) { startGame(); return; }
    if (state !== STATE.PLAYING) return;

    bird.vy = FLAP_V;
    bird.rot = -0.38;
    bird.wingT = 1;
    sfx.flap();

    // Bei jedem Flap wird geschossen!
    fireWeapon();

    // Triebwerkspartikel
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: bird.x - 12,
        y: bird.y + 2 + (Math.random() - 0.5) * 8,
        vx: -120 - Math.random() * 80,
        vy: (Math.random() - 0.5) * 40,
        r: 2 + Math.random() * 2,
        color: '#38bdf8',
        life: 0.35
      });
    }
  }

  function onPress() {
    if (state === STATE.PAUSED) { resume(); return; }
    flap();
  }

  function pause() {
    if (state !== STATE.PLAYING) return;
    state = STATE.PAUSED;
    showPanel(
      '<div class="title" style="font-size:28px">PAUSE</div>',
      '<div class="subtitle">Systeme im Standby.</div>',
      'WEITER',
      'Drücke <kbd>P</kbd> oder <kbd>Space</kbd>'
    );
  }

  function resume() {
    if (state !== STATE.PAUSED) return;
    state = STATE.PLAYING;
    hidePanel();
    last = performance.now();
  }

  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); onPress(); });
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      onPress();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      e.preventDefault();
      if (state === STATE.PLAYING) pause();
      else if (state === STATE.PAUSED) resume();
    }
  });
  actionBtn.addEventListener('click', () => {
    if (state === STATE.PAUSED) { resume(); return; }
    startGame();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* =======================================================================
     Kollision & Schaden
     ======================================================================= */
  function distSq(x1, y1, x2, y2) {
    const dx = x1 - x2, dy = y1 - y2;
    return dx * dx + dy * dy;
  }

  function damagePlayer() {
    if (bird.invulnerable > 0 || !bird.alive) return;

    if (bird.shield > 0) {
      bird.shield = 0;
      bird.invulnerable = 1.0;
      shake = 8;
      sfx.shieldHit();
      addFloatText(bird.x, bird.y - 20, 'SCHILD ZERSTÖRT!', '#38bdf8', 13);
      updateHUD();
      return;
    }

    bird.hp--;
    bird.invulnerable = 1.4;
    shake = 12;
    flash = 0.35;
    sfx.playerHit();
    addFloatText(bird.x, bird.y - 20, '-1 HP', '#ef4444', 16);
    updateHUD();

    if (bird.hp <= 0) {
      die();
    }
  }

  function die() {
    state = STATE.DYING;
    bird.alive = false;
    bird.vy = 40;
    shake = 18;
    flash = 0.6;
    sfx.bossBoom();
    spawnExplosion(bird.x, bird.y, 35, '#ef4444');
    overDelay = 0.6;

    if (score > highScore) {
      highScore = score;
      newRecord = true;
      localStorage.setItem('fbHardcoreHighScore', String(highScore));
    }
  }

  /* =======================================================================
     Update Loop (60 FPS fest)
     ======================================================================= */
  const STEP = 1 / 60;
  let acc = 0, last = performance.now();

  function update(dt) {
    bgScroll += dt * 35;

    // Sterne bewegen
    for (const s of stars) {
      s.x -= s.spd * dt;
      if (s.x < 0) { s.x = W; s.y = Math.random() * (H - 50); }
    }

    // Floating Texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y -= dt * 38;
      ft.life -= dt * 1.5;
      if (ft.life <= 0) floatTexts.splice(i, 1);
    }

    // Partikel
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 1.8;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state === STATE.READY) {
      bird.wingPhase += dt * 6;
      bird.y = 260 + Math.sin(bird.wingPhase * 0.7) * 8;
      bird.rot = Math.sin(bird.wingPhase * 0.7) * 0.05;
      return;
    }

    if (state === STATE.PAUSED) return;

    if (state === STATE.DYING) {
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      bird.rot += dt * 5;
      overDelay -= dt;
      if (bird.y + BIRD_R > GROUND_Y || overDelay <= 0) {
        state = STATE.OVER;
        panelOver();
      }
      return;
    }

    if (state === STATE.OVER) return;

    /* --- PLAYING --- */
    difficultyTime += dt;
    spawnInterval = Math.max(0.65, 1.35 - (difficultyTime / 70));

    // Timers
    if (fireTimer > 0) fireTimer -= dt;
    if (rapidFireTimer > 0) {
      rapidFireTimer -= dt;
      if (rapidFireTimer <= 0) updateHUD();
    }
    if (bird.invulnerable > 0) bird.invulnerable -= dt;

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) {
        combo = 0;
        updateHUD();
      }
    }

    // Spieler-Physik
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    if (bird.y - BIRD_R < 15) { bird.y = 15 + BIRD_R; bird.vy = Math.max(0, bird.vy); }
    bird.rot += ((bird.vy < 0 ? -0.38 : 0.65) - bird.rot) * Math.min(1, dt * 8);
    bird.wingPhase += dt * 14;

    // Boden-Kollision
    if (bird.y + BIRD_R >= GROUND_Y) {
      bird.y = GROUND_Y - BIRD_R;
      damagePlayer();
    }

    // Kontinuierliches Schießen (z. B. wenn Schnellfeuer aktiv)
    if (rapidFireTimer > 0) fireWeapon();

    // Spieler-Kugeln
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // Partikel-Schweif
      if (b.type === 'plasma' && Math.random() < 0.4) {
        particles.push({
          x: b.x, y: b.y, vx: -50, vy: (Math.random() - 0.5) * 30,
          r: 2.5, color: '#f43f5e', life: 0.25
        });
      }

      if (b.x > W + 30) {
        bullets.splice(i, 1);
        continue;
      }

      // Treffertest gegen Gegner
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (distSq(b.x, b.y, e.x, e.y) <= (b.r + e.r) * (b.r + e.r)) {
          e.hp -= b.dmg;
          bullets.splice(i, 1);
          sfx.hitEnemy();

          // Trefferpartikel
          spawnExplosion(b.x, b.y, 4, b.color);

          if (e.hp <= 0) {
            // Gegner tot
            sfx.explode();
            spawnExplosion(e.x, e.y, e.r > 18 ? 24 : 12, e.color);
            enemies.splice(j, 1);

            kills++;
            combo++;
            comboTimer = 2.4;

            const pts = e.scoreVal * (1 + Math.min(combo * 0.2, 3));
            score += Math.floor(pts);
            addFloatText(e.x, e.y, `+${Math.floor(pts)}`, '#facc15', 13);

            // Chance auf Powerup (18%)
            if (Math.random() < 0.22) {
              spawnPowerup(e.x, e.y);
            }

            updateHUD();
          }
          break;
        }
      }
    }

    // Gegner spawnen
    spawnEnemyTimer += dt;
    if (spawnEnemyTimer >= spawnInterval) {
      spawnEnemyTimer = 0;
      spawnEnemy();
    }

    // Gegner bewegen & angreifen
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.t += dt;

      if (e.type === 'kamikaze') {
        e.y = e.baseY + Math.sin(e.t * 4.5) * 45;
        e.x += e.vx * dt;
      } else {
        e.x += e.vx * dt;
      }

      // Gegner-Schuss
      if (e.shootTimer !== undefined) {
        e.shootTimer -= dt;
        if (e.shootTimer <= 0) {
          e.shootTimer = e.type === 'gunship' ? 1.4 : e.type === 'heavy' ? 1.0 : 2.0;
          const dx = bird.x - e.x;
          const dy = bird.y - e.y;
          const dist = Math.hypot(dx, dy) || 1;
          const spd = 210;
          enemyBullets.push({
            x: e.x - e.r, y: e.y,
            vx: (dx / dist) * spd,
            vy: (dy / dist) * spd,
            r: 4.5, color: '#f87171'
          });
        }
      }

      // Raus aus Bild
      if (e.x < -40) {
        enemies.splice(i, 1);
        continue;
      }

      // Rammschaden gegen Spieler
      if (bird.alive && distSq(bird.x, bird.y, e.x, e.y) <= (BIRD_R + e.r) * (BIRD_R + e.r)) {
        damagePlayer();
        e.hp -= 3;
        if (e.hp <= 0) {
          spawnExplosion(e.x, e.y, 16, e.color);
          enemies.splice(i, 1);
        }
      }
    }

    // Gegner-Kugeln bewegen
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const eb = enemyBullets[i];
      eb.x += eb.vx * dt;
      eb.y += eb.vy * dt;

      if (eb.x < -20 || eb.x > W + 20 || eb.y < -20 || eb.y > H + 20) {
        enemyBullets.splice(i, 1);
        continue;
      }

      if (bird.alive && distSq(bird.x, bird.y, eb.x, eb.y) <= (BIRD_R + eb.r) * (BIRD_R + eb.r)) {
        enemyBullets.splice(i, 1);
        damagePlayer();
      }
    }

    // Power-Ups bewegen & einsammeln
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt + Math.sin(p.t * 4) * 0.5;

      if (p.x < -30) {
        powerups.splice(i, 1);
        continue;
      }

      if (bird.alive && distSq(bird.x, bird.y, p.x, p.y) <= (BIRD_R + p.r) * (BIRD_R + p.r)) {
        sfx.powerup();

        if (p.type === 'upgrade') {
          weaponLevel = Math.min(4, weaponLevel + 1);
          addFloatText(bird.x, bird.y - 18, '⚡ WEAPON UPGRADE!', '#38bdf8', 14);
        } else if (p.type === 'shield') {
          bird.shield = 1;
          addFloatText(bird.x, bird.y - 18, '🛡️ SHIELD AKTIV!', '#a855f7', 14);
        } else if (p.type === 'heart') {
          bird.hp = Math.min(bird.maxHp, bird.hp + 1);
          addFloatText(bird.x, bird.y - 18, '❤️ +1 LEBEN!', '#ef4444', 14);
        } else if (p.type === 'rapid') {
          rapidFireTimer = 8.0;
          addFloatText(bird.x, bird.y - 18, '🔥 RAPID OVERDRIVE!', '#f97316', 15);
        } else if (p.type === 'nuke') {
          triggerNuke();
        }

        updateHUD();
        powerups.splice(i, 1);
      }
    }
  }

  /* =======================================================================
     Rendering
     ======================================================================= */
  function drawBackground() {
    // Cyber / Weltraum Hintergrund
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0d14');
    g.addColorStop(0.5, '#121824');
    g.addColorStop(1, '#1e1124');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sterne
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
      ctx.fill();
    }

    // Cyber Skyline Silhouette
    ctx.fillStyle = '#0b0f19';
    const cityOff = (bgScroll * 0.4) % 60;
    for (let x = -60; x < W + 60; x += 30) {
      const h = 80 + Math.sin(x * 12.3) * 45;
      ctx.fillRect(x - cityOff, GROUND_Y - h, 28, h);
    }

    // Boden (High-Tech Grid)
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    // Neon-Kante am Boden
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Boden-Gridlinien
    ctx.strokeStyle = 'rgba(239,68,68,0.2)';
    ctx.lineWidth = 1;
    const gridOff = (bgScroll * 1.5) % 24;
    for (let x = -24; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x - gridOff, GROUND_Y);
      ctx.lineTo(x - gridOff - 16, H);
      ctx.stroke();
    }
  }

  function drawPlayer() {
    if (bird.invulnerable > 0 && Math.floor(Date.now() / 80) % 2 === 0) {
      return; // Flackern bei Unverwundbarkeit
    }

    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // Schild-Bubble
    if (bird.shield > 0) {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.fillStyle = 'rgba(56,189,248,0.18)';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_R + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Mecha-Flügel
    const flap = Math.sin(bird.wingPhase) * 0.8;
    ctx.save();
    ctx.translate(-4, 0);
    ctx.rotate(flap);
    ctx.fillStyle = '#64748b';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-12, -7);
    ctx.lineTo(-4, 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Rumpf (Cyber Armor)
    const g = ctx.createLinearGradient(-BIRD_R, -BIRD_R, BIRD_R, BIRD_R);
    g.addColorStop(0, '#f8fafc');
    g.addColorStop(0.5, '#cbd5e1');
    g.addColorStop(1, '#64748b');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Visier / Laser-Auge
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(6, -3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Kanone auf dem Rücken
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(2, -7, 10, 4);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1;
    ctx.strokeRect(2, -7, 10, 4);

    // Schnabel
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(9, -1);
    ctx.lineTo(18, 2);
    ctx.lineTo(9, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawBullets() {
    for (const b of bullets) {
      ctx.save();
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      if (b.type === 'plasma') {
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      } else {
        ctx.rect(b.x - 6, b.y - b.r / 2, 12, b.r);
      }
      ctx.fill();
      ctx.restore();
    }

    // Gegnerische Schüsse
    for (const eb of enemyBullets) {
      ctx.save();
      ctx.fillStyle = eb.color;
      ctx.shadowColor = eb.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawEnemies() {
    for (const e of enemies) {
      ctx.save();
      ctx.translate(e.x, e.y);

      // Körper
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Auge
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-e.r * 0.35, 0, e.r * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-e.r * 0.45, 0, e.r * 0.18, 0, Math.PI * 2);
      ctx.fill();

      // HP-Leiste bei starken Gegnern
      if (e.maxHp > 2) {
        const barW = e.r * 2.2;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(-barW / 2, -e.r - 8, barW, 4);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(-barW / 2, -e.r - 8, barW * (e.hp / e.maxHp), 4);
      }

      ctx.restore();
    }
  }

  function drawPowerups() {
    for (const p of powerups) {
      ctx.save();
      ctx.translate(p.x, p.y);

      // Glüh-Aura
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Icon
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.icon, 0, 1);

      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFloatTexts() {
    for (const ft of floatTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color;
      ctx.font = `bold ${ft.size}px monospace`;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
  }

  function render() {
    ctx.save();
    if (shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
    }

    drawBackground();
    drawPowerups();
    drawBullets();
    drawEnemies();
    drawParticles();
    drawPlayer();
    drawFloatTexts();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
      flash *= 0.85;
    }

    ctx.restore();
  }

  /* =======================================================================
     Loop
     ======================================================================= */
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.2) dt = 0.2;
    acc += dt;

    let guard = 0;
    while (acc >= STEP && guard++ < 5) {
      acc -= STEP;
      update(STEP);
    }
    render();
    requestAnimationFrame(loop);
  }

  panelReady();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
